name: Enrich book data (Open Library)
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Re-check books that are already enriched"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -q tests
      - run: python scripts/enrich_openlibrary.py ${{ inputs.all && '--all' || '' }}
      - run: python scripts/build_data.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/enrichment.json data/books.json covers/
          git diff --cached --quiet || git commit -m "Enrich book data from Open Library"
          git push
