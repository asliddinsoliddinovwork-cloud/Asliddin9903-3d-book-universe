name: Probe Hilol Nashr (debug)
on:
  push:
    branches: ['debug/hilol-probe']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample pages
        run: |
          rm -rf probe && mkdir -p probe
          UA="Mozilla/5.0 (compatible; book-shelf-probe/1.0)"
          fetch(){ curl -sSL -A "$UA" --max-time 40 -o "probe/$1.html" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          {
          fetch iymon "https://hilolnashr.uz/shayx-kitoblari-uz/iymon"
          fetch hh7 "https://hilolnashr.uz/shayx-kitoblari-uz/hadis-va-hayot-7-juz"
          fetch hh28 "https://hilolnashr.uz/shayx-kitoblari-uz/hadis-va-hayot-28-juz"
          fetch baxt "https://hilolnashr.uz/shayx-kitoblari-uz/baxtiyor-oila"
          fetch mazhab "https://hilolnashr.uz/shayx-kitoblari-uz/mazhabsizlik-bidatdir"
          fetch dims "https://hilolnashr.uz/shayx-kitoblari-uz/hadis-va-hayot-36-qr"
          } | tee probe/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe samples" && git push
