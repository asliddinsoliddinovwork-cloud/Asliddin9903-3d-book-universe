name: Probe Hilol Nashr (debug)
on:
  push:
    branches: ['debug/hilol-probe']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sample pages
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (compatible; book-shelf-probe/1.0)"
          fetch(){ curl -sSL -A "$UA" --max-time 40 -o "probe/$1.html" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          {
          fetch home "https://hilolnashr.uz/"
          fetch author "https://hilolnashr.uz/shayx-kitoblari-uz"
          fetch author_limit "https://hilolnashr.uz/shayx-kitoblari-uz?limit=100"
          fetch author_p2 "https://hilolnashr.uz/shayx-kitoblari-uz?page=2"
          fetch quron "https://hilolnashr.uz/quron-ilmlari"
          fetch tafsir "https://hilolnashr.uz/tafsiri-hilol-6-jildlik"
          fetch search "https://hilolnashr.uz/index.php?route=product/search&search=%D0%A1%D0%BE%D0%B4%D0%B8%D2%9B&description=true&limit=100"
          fetch kitoblar "https://hilolnashr.uz/kitoblar"
          fetch sitemap "https://hilolnashr.uz/index.php?route=extension/feed/google_sitemap"
          fetch sitemap2 "https://hilolnashr.uz/sitemap.xml"
          } | tee probe/status.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe samples" && git push
