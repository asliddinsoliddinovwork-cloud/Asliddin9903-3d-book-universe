name: Update books from Hilol Nashr
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly, 1st day 03:00 UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scrape_hilol.py
      - name: Build site data (if the builder supports this source)
        run: if grep -q hilol_products scripts/build_data.py; then python scripts/build_data.py; fi
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/ covers/
          git diff --cached --quiet || git commit -m "Update books from Hilol Nashr"
          git push
