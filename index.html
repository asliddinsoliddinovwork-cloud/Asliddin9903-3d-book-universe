<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitob Javoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: black gallery wall; one horizontal shelf of spines at real proportions; detail panel below. */
:root{
  --bg:#000; --fg:#f5f5f7; --muted:#86868b; --line:#2c2c2e; --chip:#1c1c1e; --accent:#f5f5f7;
  /* SF Pro renders on Apple devices (system font); other systems fall back to Inter. */
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html{height:100%;}
body{margin:0;min-height:100%;}
[hidden]{display:none!important;}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100%;}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));}

header{padding-top:max(28px,env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;}
.brand span{color:var(--muted);font-weight:400;}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
select,button{font:500 13px var(--font);color:var(--fg);background:var(--chip);border:1px solid transparent;border-radius:980px;padding:7px 14px;cursor:pointer;}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;}
select:hover,button:hover{border-color:#48484a;}
:focus-visible{outline:2px solid #0a84ff;outline-offset:2px;}

.title{margin:56px 0 0;display:flex;align-items:center;justify-content:center;gap:20px;
  font-weight:600;font-size:clamp(20px,2.6vw,30px);letter-spacing:.06em;text-transform:uppercase;text-align:center;}
.title::before,.title::after{content:"";height:1px;width:clamp(32px,8vw,80px);background:var(--fg);opacity:.8;flex:none;}
.sub{margin:10px auto 0;text-align:center;color:var(--muted);font-size:14px;max-width:60ch;}

/* Shelf */
#shelfWrap{position:relative;margin-top:40px;}
#shelf{display:flex;align-items:flex-end;gap:var(--gap,6px);overflow-x:auto;overflow-y:hidden;
  padding:40px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));
  scroll-behavior:smooth;scrollbar-width:none;perspective:1800px;}
#shelf::-webkit-scrollbar{display:none;}
.book{position:relative;flex:none;width:var(--t);height:var(--h);transition:width .55s cubic-bezier(.2,.8,.2,1),transform .25s ease;
  cursor:pointer;background:none;border:0;padding:0;border-radius:0;perspective:1800px;}
.book:hover:not(.open){transform:translateY(-10px);}
.book .box{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:var(--t) 50%;
  transition:transform .55s cubic-bezier(.2,.8,.2,1);}
.book.open .box{transform:translateX(calc(var(--t) * -1)) rotateY(-90deg);}
.spine,.cover{position:absolute;top:0;height:100%;backface-visibility:hidden;}
.spine{left:0;width:var(--t);background:var(--c,#3a3a3c);color:var(--ink,#fff);
  display:flex;align-items:flex-start;justify-content:center;overflow:hidden;
  box-shadow:inset 3px 0 6px rgba(255,255,255,.08),inset -4px 0 8px rgba(0,0,0,.35);}
.spine b{writing-mode:vertical-rl;font-weight:600;font-size:var(--fs,14px);letter-spacing:-.005em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-height:calc(100% - 28px);margin-top:16px;}
.spine i{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;opacity:.7;font-variant-numeric:tabular-nums;}
.cover{left:var(--t);width:var(--w);transform-origin:left center;transform:rotateY(90deg);background:var(--c,#3a3a3c);overflow:hidden;
  box-shadow:inset 6px 0 10px rgba(0,0,0,.35);}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;text-align:center;color:var(--ink,#fff);}
.cover .gen strong{font-size:18px;line-height:1.2;letter-spacing:-.01em;}
.cover .gen small{font-size:12px;opacity:.75;}
.book.open{width:calc(var(--w) + 4px);}
.book.dim{opacity:.18;}
#shelfLine{height:1px;background:var(--line);margin:0 max(24px,env(safe-area-inset-left,0px));}
#decades{position:relative;height:28px;overflow:hidden;}
#decades span{position:absolute;top:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.edge{position:absolute;top:0;bottom:0;width:48px;pointer-events:none;z-index:2;}
.edge.l{left:0;background:linear-gradient(90deg,var(--bg),transparent);} .edge.r{right:0;background:linear-gradient(270deg,var(--bg),transparent);}

/* Year rail */
#rail{display:flex;gap:14px;align-items:center;margin-top:8px;}
#rail label{font-size:12px;color:var(--muted);white-space:nowrap;}
#year{flex:1;min-width:0;accent-color:var(--fg);}
#yearOut{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right;}
.nav{display:flex;gap:6px;} .nav button{width:36px;padding:7px 0;}

/* Detail */
#detail{margin:36px auto 0;max-width:880px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 48px;min-height:180px;}
#detail h2{grid-column:1/-1;margin:0;font-size:clamp(24px,3.4vw,36px);line-height:1.1;letter-spacing:-.02em;font-weight:700;text-wrap:balance;}
#detail .meta{grid-column:1/-1;color:var(--muted);font-size:16px;margin-bottom:16px;}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;align-content:start;}
dt{color:var(--muted);} dd{margin:0;min-width:0;overflow-wrap:anywhere;}
.num{font-variant-numeric:tabular-nums;}
.note{font-size:13px;color:#ff9f0a;margin-top:10px;}
.src{font-size:13px;color:var(--muted);display:grid;gap:4px;align-content:start;}
.src a{color:#2997ff;text-decoration:none;} .src a:hover{text-decoration:underline;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);align-self:center;}
footer{margin-top:auto;padding-top:48px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px;text-align:center;}
#msg{color:#ff9f0a;text-align:center;margin-top:24px;}
@media (max-width:700px){
  #detail{grid-template-columns:1fr;gap:20px;}
  .title{margin-top:36px;}
}
@media (prefers-reduced-motion:reduce){ .book,.book .box,#shelf{transition:none;scroll-behavior:auto;} }
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><span data-i18n="brand"></span></div>
  <div class="tools">
    <select id="genre" aria-label="Genre"></select>
    <select id="language" aria-label="Language of original"></select>
    <button id="lang" type="button" aria-label="Switch language">EN</button>
  </div>
</header>

<h1 class="title wrap" data-i18n="title"></h1>
<p class="sub wrap" data-i18n="sub"></p>

<div id="shelfWrap">
  <div class="edge l"></div><div class="edge r"></div>
  <div id="shelf" role="list" aria-label="Books"></div>
  <div id="shelfLine"></div>
  <div id="decades" aria-hidden="true"></div>
</div>

<div id="rail" class="wrap">
  <label for="year" data-i18n="jump"></label>
  <input id="year" type="range" min="1300" max="2025" value="1300">
  <output id="yearOut" for="year"></output>
  <div class="nav"><button id="prev" type="button" aria-label="Previous">‹</button><button id="next" type="button" aria-label="Next">›</button></div>
</div>

<section id="detail" class="wrap" aria-live="polite"></section>
<div id="msg" class="wrap" hidden></div>

<footer class="wrap" data-i18n-html="footer"></footer>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const I18N={
 uz:{brand:'Kitob Javoni',title:'Eng ko‘p sotilgan kitoblar',sub:'Dunyoda 10 milliondan ortiq nusxada sotilgan kitoblar, nashr yili bo‘yicha. O‘lchamlar haqiqiy nisbatda.',
  allGenres:'Barcha janrlar',allLangs:'Barcha tillar',jump:'Yilga o‘tish',year:'Yil',language:'Asl tili',genre:'Janr',sales:'Sotuv (taxm.)',
  size:'O‘lcham',pages:'Sahifalar',listSrc:'Ro‘yxat: Wikipedia',olSrc:'Nashr: Open Library',cover:'Muqova: Open Library',
  estHW:'Bo‘yi va eni manbada topilmadi: 210 × 140 mm deb olindi (taxminiy).',estT:'Qalinlik sahifalar sonidan hisoblangan (taxminiy).',rej:'Open Library’dagi nashr o‘lchami ishonchsiz chiqdi (masalan, audio quti), shuning uchun ishlatilmadi.',noT:'Qalinlik topilmadi: 30 mm deb olindi (taxminiy).',
  pick:'Kitobni tanlang: qirrasini bosing yoki ‹ › tugmalaridan foydalaning.',none:'Bu filtr bo‘yicha kitob yo‘q.',
  loadFail:'Ma’lumot yuklanmadi. Sahifani veb-server orqali oching.',genreNote:'Janr guruhi Wikipedia’dagi janr matnidan ajratilgan.',
  footer:'Ro‘yxat: <a href="https://en.wikipedia.org/wiki/List_of_best-selling_books" target="_blank" rel="noopener">Wikipedia</a> · O‘lcham va muqovalar: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> · Sotuv raqamlari taxminiy'},
 en:{brand:'Book Shelf',title:'Best-selling books',sub:'Books that have sold more than 10 million copies worldwide, by year of first publication. Drawn to real proportions.',
  allGenres:'All genres',allLangs:'All languages',jump:'Jump to year',year:'Year',language:'Original language',genre:'Genre',sales:'Sales (approx.)',
  size:'Size',pages:'Pages',listSrc:'List: Wikipedia',olSrc:'Edition: Open Library',cover:'Cover: Open Library',
  estHW:'Height and width not found in sources: 210 × 140 mm assumed (estimate).',estT:'Thickness estimated from page count.',rej:'The Open Library edition size looked implausible (e.g. an audio box), so it was not used.',noT:'Thickness not found: 30 mm assumed (estimate).',
  pick:'Pick a book: click its spine or use the ‹ › buttons.',none:'No books match this filter.',
  loadFail:'Could not load data. Open the page through a web server.',genreNote:'Genre group derived from Wikipedia’s genre text.',
  footer:'List: <a href="https://en.wikipedia.org/wiki/List_of_best-selling_books" target="_blank" rel="noopener">Wikipedia</a> · Sizes and covers: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> · Sales figures are approximate'}
};
let lang='uz';try{lang=localStorage.getItem('kj-lang')||'uz';}catch(e){}
const T=k=>I18N[lang][k]??k;
const DEF={h:210,w:140,t:30};
const PALETTE=['#c4542e','#2c2c2e','#d1d1d6','#1c1c1e','#a1a1a6','#3a3a3c','#8e8e93','#e5e5ea'];
let DATA=null,books=[],openIdx=-1,S=1.4;

function hash(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))|0;return Math.abs(h);}
function ink(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?'#1d1d1f':'#f5f5f7';}
function langName(k){return DATA.languages[k]?.[lang]||k;}
function genreName(k){return DATA.genres[k]?.[lang]||k;}
function scale(){return Math.max(0.9,Math.min(1.7,(innerHeight*0.46)/260));}

/* Average colour of a cover, used for its spine (same-origin images only). */
function coverColour(img){try{const c=document.createElement('canvas');c.width=c.height=12;const g=c.getContext('2d');g.drawImage(img,0,0,12,12);
  const d=g.getImageData(0,0,12,12).data;let r=0,gg=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2];}const n=d.length/4;
  const f=v=>Math.round(v/n*0.85).toString(16).padStart(2,'0');return '#'+f(r)+f(gg)+f(b);}catch(e){return null;}}

function render(){
  S=scale();
  const gf=$('genre').value,lf=$('language').value;
  books=DATA.books.filter(b=>(gf==='*'||b.genre_tags.includes(gf))&&(lf==='*'||b.language===lf));
  const shelf=$('shelf');shelf.innerHTML='';openIdx=-1;
  document.documentElement.style.setProperty('--gap',Math.round(4*S)+'px');
  books.forEach((b,i)=>{
    const h=(b.height_mm||DEF.h)*S,w=(b.width_mm||DEF.w)*S,t=Math.max(14,(b.thickness_mm||DEF.t)*S);
    const c=PALETTE[hash(b.id)%PALETTE.length];
    const el=document.createElement('button');el.type='button';el.className='book';el.setAttribute('role','listitem');
    el.style.cssText=`--h:${h}px;--w:${w}px;--t:${t}px;--c:${c};--ink:${ink(c)};--fs:${Math.max(9,Math.min(15,t*0.42))}px`;
    el.setAttribute('aria-label',b.title+', '+b.author+', '+(b.year_text||''));
    el.innerHTML=`<div class="box"><div class="spine"><b></b><i class="num"></i></div><div class="cover"></div></div>`;
    el.querySelector('b').textContent=b.title;el.querySelector('i').textContent=t>=26?(b.year??''):'';
    const cov=el.querySelector('.cover');
    if(b.cover){const img=new Image();img.alt='';img.loading='lazy';img.decoding='async';img.src=b.cover;
      img.onload=()=>{const col=coverColour(img);if(col){el.style.setProperty('--c',col);el.style.setProperty('--ink',ink(col));}};
      img.onerror=()=>{img.remove();cov.appendChild(genCover(b));};cov.appendChild(img);}
    else cov.appendChild(genCover(b));
    el.onclick=()=>toggle(i);
    shelf.appendChild(el);
  });
  drawDecades();updateRange();showDetail(null);
}
function genCover(b){const d=document.createElement('div');d.className='gen';const s=document.createElement('strong');s.textContent=b.title;
  const a=document.createElement('small');a.textContent=b.author;d.append(s,a);return d;}
function drawDecades(){const box=$('decades');box.innerHTML='';const shelf=$('shelf');let last=null;
  [...shelf.children].forEach((el,i)=>{const y=books[i].year;if(y==null)return;const dec=y<1900?Math.floor(y/100)*100:Math.floor(y/10)*10;
    if(dec!==last){last=dec;const s=document.createElement('span');s.textContent=y<1900?dec+'s':dec;s.dataset.left=el.offsetLeft;box.appendChild(s);}});
  positionDecades();}
function positionDecades(){const sl=$('shelf').scrollLeft;let lastX=-99;
  [...$('decades').children].forEach(s=>{const x=Number(s.dataset.left)-sl;s.style.left=x+'px';
    s.style.visibility=x-lastX<40?'hidden':'visible';if(s.style.visibility==='visible')lastX=x;});}
$('shelf').addEventListener('scroll',()=>requestAnimationFrame(positionDecades),{passive:true});
$('shelf').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){$('shelf').scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});

function toggle(i){const els=$('shelf').children;
  if(openIdx===i){els[i].classList.remove('open');openIdx=-1;showDetail(null);return;}
  if(openIdx>=0&&els[openIdx])els[openIdx].classList.remove('open');
  openIdx=i;const el=els[i];el.classList.add('open');showDetail(books[i]);
  setTimeout(()=>{const sh=$('shelf');sh.scrollLeft=el.offsetLeft-sh.clientWidth/2+el.offsetWidth/2;},60);
  if(books[i].year!=null){$('year').value=books[i].year;$('yearOut').textContent=books[i].year;}}
function step(d){if(!books.length)return;const n=openIdx<0?(d>0?0:books.length-1):Math.max(0,Math.min(books.length-1,openIdx+d));if(n!==openIdx)toggle(n);}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowRight'){step(1);e.preventDefault();}if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}
  if(e.key==='Escape'&&openIdx>=0)toggle(openIdx);});

function updateRange(){const ys=books.map(b=>b.year).filter(y=>y!=null);const el=$('year');if(!ys.length)return;
  el.min=Math.min(...ys);el.max=Math.max(...ys);el.value=el.min;$('yearOut').textContent=el.min;}
$('year').oninput=e=>{const y=Number(e.target.value);$('yearOut').textContent=y;const i=books.findIndex(b=>b.year!=null&&b.year>=y);
  const el=$('shelf').children[i<0?books.length-1:i];if(el){const sh=$('shelf');sh.scrollLeft=el.offsetLeft-40;}};

function row(dl,k,v,cls){const dt=document.createElement('dt');dt.textContent=T(k);const dd=document.createElement('dd');dd.textContent=v;if(cls)dd.className=cls;dl.append(dt,dd);}
function a(href,txt){const x=document.createElement('a');x.href=href;x.target='_blank';x.rel='noopener';x.textContent=txt;return x;}
function showDetail(b){const d=$('detail');d.innerHTML='';
  if(!b){const p=document.createElement('p');p.className='empty';p.textContent=books.length?T('pick'):T('none');d.appendChild(p);return;}
  const h=document.createElement('h2');h.textContent=b.title;
  const m=document.createElement('div');m.className='meta';m.textContent=b.author+(b.original_title?' · '+b.original_title:'');
  const dl=document.createElement('dl');
  row(dl,'year',b.year_text||'—','num');row(dl,'language',langName(b.language));
  row(dl,'genre',genreName(b.genre)+(b.genre_text?' ('+b.genre_text+')':''));row(dl,'sales',b.sales_text);
  const hwEst=!(b.height_mm&&b.width_mm),tEst=!b.thickness_mm||b.dims_method==='pages_estimate';
  row(dl,'size',`${b.height_mm||DEF.h}${hwEst?'*':''} × ${b.width_mm||DEF.w}${hwEst?'*':''} × ${b.thickness_mm||DEF.t}${tEst?'*':''} mm`,'num');
  if(b.pages)row(dl,'pages',String(b.pages),'num');
  const src=document.createElement('div');src.className='src';
  src.append(a(b.list_source,T('listSrc')));if(b.edition_source)src.append(a(b.edition_source,T('olSrc')));
  if(b.cover){const s=document.createElement('span');s.textContent=T('cover');src.append(s);}
  const gn=document.createElement('span');gn.textContent=T('genreNote');src.append(gn);
  const notes=[];if(b.dims_rejected)notes.push(T('rej'));if(hwEst)notes.push(T('estHW'));if(b.dims_method==='pages_estimate')notes.push(T('estT'));else if(!b.thickness_mm)notes.push(T('noT'));
  if(notes.length){const n=document.createElement('div');n.className='note';n.textContent='* '+notes.join(' ');src.append(n);}
  d.append(h,m,dl,src);}

function fillFilters(){const gs=$('genre'),ls=$('language'),gv=gs.value||'*',lv=ls.value||'*';
  const gc={},lc={};DATA.books.forEach(b=>{b.genre_tags.forEach(t=>gc[t]=(gc[t]||0)+1);lc[b.language]=(lc[b.language]||0)+1;});
  gs.innerHTML='';ls.innerHTML='';
  const opt=(sel,v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o);};
  opt(gs,'*',T('allGenres'));Object.keys(gc).sort((x,y)=>gc[y]-gc[x]).forEach(k=>opt(gs,k,genreName(k)+' · '+gc[k]));
  opt(ls,'*',T('allLangs'));Object.keys(lc).sort((x,y)=>lc[y]-lc[x]).forEach(k=>opt(ls,k,langName(k)+' · '+lc[k]));
  gs.value=gv;ls.value=lv;}
function applyLang(){document.documentElement.lang=lang;document.title=T('brand');$('lang').textContent=lang==='uz'?'EN':'UZ';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  if(DATA){fillFilters();const keep=openIdx;showDetail(keep>=0?books[keep]:null);}}
$('lang').onclick=()=>{lang=lang==='uz'?'en':'uz';try{localStorage.setItem('kj-lang',lang);}catch(e){}applyLang();};
$('genre').onchange=render;$('language').onchange=render;
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(DATA&&Math.abs(scale()-S)>0.05){const k=openIdx;render();if(k>=0&&k<books.length)toggle(k);}else positionDecades();},200);});

applyLang();
fetch('data/books.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{DATA=d;fillFilters();render();})
  .catch(e=>{console.error(e);const m=$('msg');m.hidden=false;m.textContent=T('loadFail');});
})();
</script>
</body>
</html>
