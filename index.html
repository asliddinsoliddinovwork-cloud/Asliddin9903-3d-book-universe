<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitob Silindri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen 3D cylinder room; thin UI layers float on top. Single dark library look. */
:root{
  --ink:#16120f; --panel:rgba(26,21,17,.88); --paper:#efe6d6; --muted:#a89c8a;
  --brass:#c9a35b; --warn:#e0884f; --line:rgba(239,230,214,.14);
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:var(--ink);color:var(--paper);font:14px/1.4 var(--f-ui);overflow:hidden;}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;}
#stage.dragging{cursor:grabbing;} #stage.hovering{cursor:pointer;}
.ui{position:fixed;z-index:5;}
#top{top:env(safe-area-inset-top,0px);left:0;right:0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:linear-gradient(var(--ink),rgba(22,18,15,0));pointer-events:none;}
#top > *{pointer-events:auto;}
h1{margin:0;font:700 22px/1.1 var(--f-display);}
h1 small{display:block;font:500 11px/1.3 var(--f-ui);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
label.l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
select,button{font:500 13px var(--f-ui);color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer;}
button:hover,select:hover{border-color:var(--brass);}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
#lang{font-family:var(--f-mono);}
#rail{left:0;right:0;bottom:env(safe-area-inset-bottom,0px);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;align-items:center;background:linear-gradient(rgba(22,18,15,0),var(--ink));}
#rail input[type=range]{flex:1;min-width:0;accent-color:var(--brass);}
#yearOut{font:500 20px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brass);min-width:4.2ch;text-align:right;}
#zoom{display:flex;gap:6px;} #zoom button{width:34px;padding:7px 0;}
#card{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
  width:min(340px,calc(100vw - 32px));max-height:calc(100% - 180px);overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:16px;backdrop-filter:blur(6px);display:grid;gap:10px;}
#card h2{margin:0;padding-right:28px;font:700 20px/1.2 var(--f-display);text-wrap:balance;}
#card .by{color:var(--muted);font-size:13px;}
#card .orig{font-style:italic;color:var(--muted);font-size:13px;}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px;}
dt{color:var(--muted);} dd{margin:0;min-width:0;overflow-wrap:anywhere;}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.note{font-size:12px;color:var(--warn);line-height:1.4;}
.src{font-size:12px;color:var(--muted);display:grid;gap:2px;}
.src a{color:var(--brass);}
#card .x{position:absolute;top:8px;right:8px;padding:2px 8px;}
#help{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
  max-width:min(360px,calc(100vw - 32px));font-size:12px;color:var(--muted);line-height:1.5;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:10px 12px;}
#help b{color:var(--paper);font-weight:500;}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:12px;max-width:260px;}
#msg{position:fixed;inset:auto 16px 50% 16px;z-index:9;text-align:center;color:var(--warn);font-size:15px;}
@media (max-width:640px){ #help{display:none;} #card{left:16px;right:16px;width:auto;} h1{font-size:18px;} }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D bookshelf"></canvas>

<div id="top" class="ui">
  <h1><span data-i18n="title"></span><small data-i18n="subtitle"></small></h1>
  <div class="ctl">
    <label class="l" for="mode" data-i18n="arrange"></label>
    <select id="mode">
      <option value="all" data-i18n="modeAll"></option>
      <option value="language" data-i18n="modeLang"></option>
      <option value="genre" data-i18n="modeGenre"></option>
    </select>
    <select id="group" aria-label="Section" hidden></select>
    <label class="l" for="genreFilter" data-i18n="genre"></label>
    <select id="genreFilter"></select>
    <button id="lang" type="button" aria-label="Language">EN</button>
  </div>
</div>

<div id="help" class="ui" data-i18n-html="help"></div>

<div id="card" class="ui" hidden>
  <button class="x" id="closeCard" type="button" aria-label="Close">×</button>
  <h2 id="cTitle"></h2>
  <div class="orig" id="cOrig"></div>
  <div class="by" id="cAuthor"></div>
  <dl>
    <dt data-i18n="year"></dt><dd id="cYear" class="num"></dd>
    <dt data-i18n="language"></dt><dd id="cLang"></dd>
    <dt data-i18n="genre"></dt><dd id="cGenre"></dd>
    <dt data-i18n="sales"></dt><dd id="cSales"></dd>
    <dt data-i18n="height"></dt><dd id="cH" class="num"></dd>
    <dt data-i18n="width"></dt><dd id="cW" class="num"></dd>
    <dt data-i18n="thickness"></dt><dd id="cT" class="num"></dd>
  </dl>
  <div class="note" id="cNote"></div>
  <div class="src" id="cSrc"></div>
</div>

<div id="rail" class="ui">
  <label class="l" for="year" data-i18n="jump"></label>
  <input id="year" type="range" min="1300" max="2025" step="1" value="1300">
  <output id="yearOut" for="year"></output>
  <div id="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>
</div>
<div id="tip" hidden></div>
<div id="msg" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function showMsg(t){const m=$('msg');m.textContent=t;m.hidden=!t;}

/* ---------- i18n ---------- */
const I18N={
 uz:{title:'Kitob Silindri',subtitle:'Dunyoning eng ko‘p sotilgan kitoblari · yillar bo‘yicha',arrange:'Tartib',
  modeAll:'Hammasi (yil bo‘yicha)',modeLang:'Asl til bo‘yicha',modeGenre:'Janr bo‘yicha',genre:'Janr',allGenres:'Barcha janrlar',
  year:'Yil',language:'Asl tili',sales:'Sotuv (taxm.)',height:'Bo‘yi',width:'Eni',thickness:'Qalinligi',jump:'Yilga o‘tish',
  author:'Muallif',listSrc:'Ro‘yxat manbasi: Wikipedia',edSrc:'Nashr ma’lumoti: Open Library',coverSrc:'Muqova: Open Library',
  estDefault:'O‘lcham manbada topilmadi: standart 210 × 140 mm ishlatildi (taxminiy).',
  estThick:'Qalinlik sahifalar sonidan hisoblangan (taxminiy).',noThick:'Qalinlik manbada yo‘q: 30 mm deb olindi (taxminiy).',
  genreNote:'Janr guruhi: Wikipedia’dagi janr matnidan loyiha bo‘yicha ajratilgan.',
  help:'<b>Boshqaruv:</b> sudrab aylantiring, g‘ildirak yoki +/− bilan yaqinlashtiring, kitobni bosing. Ro‘yxat: Wikipedia “List of best-selling books” (10 mln+ nusxa). O‘lcham va muqovalar Open Library’dan; topilmaganlari <b>taxminiy</b> deb belgilangan.',
  loadFail:'Ma’lumot yuklanmadi. Sahifani veb-server orqali oching (README’ga qarang).',noGl:'3D kutubxona yuklanmadi. Sahifani yangilang.',books:'kitob'},
 en:{title:'Book Cylinder',subtitle:'The world’s best-selling books · ordered by year',arrange:'Arrange',
  modeAll:'All (by year)',modeLang:'By original language',modeGenre:'By genre',genre:'Genre',allGenres:'All genres',
  year:'Year',language:'Original language',sales:'Sales (approx.)',height:'Height',width:'Width',thickness:'Thickness',jump:'Jump to year',
  author:'Author',listSrc:'List source: Wikipedia',edSrc:'Edition data: Open Library',coverSrc:'Cover: Open Library',
  estDefault:'No dimensions found in sources: default 210 × 140 mm used (estimate).',
  estThick:'Thickness estimated from page count.',noThick:'No thickness in sources: 30 mm assumed (estimate).',
  genreNote:'Genre group: this project’s grouping of Wikipedia’s genre text.',
  help:'<b>Controls:</b> drag to look around, scroll or +/− to zoom, click a book. List: Wikipedia “List of best-selling books” (10M+ copies). Dimensions and covers from Open Library; anything not found is marked <b>estimated</b>.',
  loadFail:'Could not load data. Open the page through a web server (see README).',noGl:'3D library failed to load. Reload the page.',books:'books'}
};
let lang='uz';try{lang=localStorage.getItem('kc-lang')||'uz';}catch(e){}
const T=k=>I18N[lang][k]??k;

if(!window.THREE){showMsg(I18N[lang].noGl);return;}

/* ---------- Constants (metres) ---------- */
const ROWS=[1.92,1.52,1.12,0.72,0.32];
const SHELF_DEPTH=0.27,BOARD_T=0.02,GAP=0.002,EYE=1.45;
const DEF={h:210,w:140,t:30};
const SPINE_COLORS=['#6b2d2a','#2f4a3a','#1f3550','#7a5a2b','#4a2f4f','#3d3d3a','#8a3f22','#28433f','#5a1f2a','#2b2b45','#6e6a4c','#93704a'];
function hash(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))|0;return Math.abs(h);}

/* ---------- Scene ---------- */
const canvas=$('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color('#120e0b');scene.fog=new THREE.Fog('#120e0b',4,14);
const camera=new THREE.PerspectiveCamera(62,1,0.02,60);camera.position.set(0,EYE,0);
scene.add(new THREE.HemisphereLight('#fff1d8','#2a1c12',0.75));
const lamp=new THREE.PointLight('#ffd9a0',1.1,12,1.6);lamp.position.set(0,2.5,0);scene.add(lamp);
const lamp2=new THREE.PointLight('#ffe8c8',0.5,8,2);lamp2.position.set(0,0.6,0);scene.add(lamp2);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function woodTexture(base,stripe,w,h,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,w,h);const r=mulberry32(3);
  for(let i=0;i<80;i++){g.strokeStyle=stripe;g.globalAlpha=0.05+r()*0.12;g.lineWidth=1+r()*3;const y=r()*h;g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=32)g.lineTo(x,y+Math.sin(x/40+i)*3);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,1);t.encoding=THREE.sRGBEncoding;return t;}
const matBoard=new THREE.MeshStandardMaterial({map:woodTexture('#6b4a2f','#2b1a0e',512,64,24),roughness:0.8,side:THREE.DoubleSide});
const matWall=new THREE.MeshStandardMaterial({map:woodTexture('#2c1e14','#0f0904',512,128,10),roughness:0.95,side:THREE.DoubleSide});
const matFloor=new THREE.MeshStandardMaterial({color:'#1d1510',roughness:1});
const matPages=new THREE.MeshStandardMaterial({color:'#e4d8bf',roughness:1});

let room=new THREE.Group();scene.add(room);
let bookMeshes=[],groups=[],R=2,DATA=null;
const disposables=[];const track=o=>(disposables.push(o),o);

function fitText(g,text,maxW,size,weight,family){let s=size;do{g.font=weight+' '+s+'px '+family;s--;}while(g.measureText(text).width>maxW&&s>8);}
function spineTexture(b){const W=64,H=256,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=b.color;g.fillRect(0,0,W,H);
  const grd=g.createLinearGradient(0,0,W,0);grd.addColorStop(0,'rgba(0,0,0,.35)');grd.addColorStop(.3,'rgba(255,255,255,.08)');grd.addColorStop(1,'rgba(0,0,0,.4)');g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.fillStyle='#d8bd7e';g.fillRect(0,14,W,2);g.fillRect(0,H-16,W,2);
  g.save();g.translate(W/2,H/2);g.rotate(Math.PI/2);g.fillStyle='#ecdcb4';g.textAlign='center';g.textBaseline='middle';
  fitText(g,b.title,H-60,26,'600','Spectral, Georgia, serif');g.fillText(b.title,0,-6);
  g.font='500 15px "IBM Plex Mono", monospace';g.fillStyle='#d8bd7e';g.fillText(String(b.year??'—'),0,16);g.restore();
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return track(t);}
function coverTexture(b){const W=256,H=Math.round(256*(b.h/b.w)),c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle=b.color;g.fillRect(0,0,W,H);g.strokeStyle='#d8bd7e';g.lineWidth=3;g.strokeRect(14,14,W-28,H-28);g.fillStyle='#ecdcb4';g.textAlign='center';
  const words=b.title.split(' ');const lines=[''];g.font='700 26px Spectral, Georgia, serif';
  words.forEach(w=>{const t=(lines[lines.length-1]+' '+w).trim();if(g.measureText(t).width>W-50&&lines[lines.length-1])lines.push(w);else lines[lines.length-1]=t;});
  lines.forEach((l,i)=>g.fillText(l,W/2,H*0.3+i*32));g.font='500 16px "IBM Plex Sans", sans-serif';g.fillStyle='#d8bd7e';g.fillText(b.author,W/2,H*0.7);
  g.font='500 15px "IBM Plex Mono", monospace';g.fillText(String(b.year??''),W/2,H*0.78);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return track(t);}
function labelMesh(text,w,h,o={}){const px=o.px||48,c=document.createElement('canvas');c.height=px*2;c.width=Math.round(px*2*w/h);const g=c.getContext('2d');
  g.fillStyle=o.bg||'#1a120c';g.fillRect(0,0,c.width,c.height);g.fillStyle=o.fg||'#c9a35b';g.textAlign='center';g.textBaseline='middle';
  fitText(g,text,c.width-16,Math.round(px*1.1),o.weight||'600',o.family||'"IBM Plex Mono", monospace');g.fillText(text,c.width/2,c.height/2+2);
  const t=track(new THREE.CanvasTexture(c));t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  return new THREE.Mesh(track(new THREE.PlaneGeometry(w,h)),track(new THREE.MeshBasicMaterial({map:t})));}

/* ---------- Data ---------- */
function prep(b){return Object.assign({},b,{
  h:b.height_mm||DEF.h,w:b.width_mm||DEF.w,t:b.thickness_mm||DEF.t,
  hwEstimated:!(b.height_mm&&b.width_mm),tEstimated:!b.thickness_mm,
  color:SPINE_COLORS[hash(b.id)%SPINE_COLORS.length]});}
function langName(k){const l=DATA.languages[k];return l?l[lang]:k;}
function genreName(k){const g=DATA.genres[k];return g?g[lang]:k;}
function makeGroups(){
  const mode=$('mode').value,gf=$('genreFilter').value;
  const books=DATA.books.filter(b=>gf==='*'||b.genre_tags.includes(gf));
  if(mode==='all')return [{key:'all',name:'',books}];
  const by=new Map();const key=mode==='language'?(b=>b.language):(b=>b.genre);
  books.forEach(b=>{const k=key(b);if(!by.has(k))by.set(k,[]);by.get(k).push(b);});
  return [...by.entries()].sort((a,b)=>b[1].length-a[1].length)
    .map(([k,bs])=>({key:k,name:mode==='language'?langName(k):genreName(k),books:bs}));
}

/* ---------- Layout: each group gets a sector sized by its shelf length; books flow rows by year ---------- */
function rowsNeeded(books,arc){let rows=1,s=0;for(const b of books){const t=b.t/1000+GAP;if(s+t>arc&&s>0){rows++;s=0;}s+=t;}return rows;}
function build(){
  room.traverse(o=>{if(o.geometry&&!disposables.includes(o.geometry))o.geometry.dispose();});
  disposables.forEach(d=>d.dispose());disposables.length=0;scene.remove(room);room=new THREE.Group();scene.add(room);
  bookMeshes=[];selected=null;hideCard();hideTip();
  groups=makeGroups().filter(g=>g.books.length).map(g=>({...g,books:g.books.map(prep).sort((a,b)=>(a.year??9999)-(b.year??9999))}));
  const n=groups.length;if(!n){updateGroupSelect();return;}
  const margin=n>1?0.16:0.06;
  const len=groups.map(g=>g.books.reduce((s,b)=>s+b.t/1000+GAP,0)+margin);
  const total=len.reduce((a,b)=>a+b,0);
  // shares: proportional to shelf length, but at least 4% so tiny groups still get a readable label
  let shares=len.map(l=>Math.max(l/total,0.04));const ss=shares.reduce((a,b)=>a+b,0);shares=shares.map(s=>s/ss);
  for(R=1.3;R<12;R+=0.05){if(groups.every((g,i)=>rowsNeeded(g.books,shares[i]*2*Math.PI*R-margin)<=ROWS.length))break;}
  const outer=R+SHELF_DEPTH;
  const wall=new THREE.Mesh(track(new THREE.CylinderGeometry(outer,outer,2.5,192,1,true)),matWall);wall.position.y=1.25;room.add(wall);
  const floor=new THREE.Mesh(track(new THREE.CircleGeometry(outer+0.05,96)),matFloor);floor.rotation.x=-Math.PI/2;room.add(floor);
  const ceil=new THREE.Mesh(track(new THREE.CircleGeometry(outer+0.05,96)),track(new THREE.MeshStandardMaterial({color:'#0e0a07',side:THREE.DoubleSide})));ceil.rotation.x=Math.PI/2;ceil.position.y=2.5;room.add(ceil);
  const boardTop=track(new THREE.RingGeometry(R,outer,192,1)),boardEdge=track(new THREE.CylinderGeometry(R,R,BOARD_T,192,1,true));
  [...ROWS,2.32].forEach(y=>{const top=new THREE.Mesh(boardTop,matBoard);top.rotation.x=-Math.PI/2;top.position.y=y+BOARD_T/2;room.add(top);
    const e=new THREE.Mesh(boardEdge,matBoard);e.position.y=y;room.add(e);});
  const geo=new Map();let a0=0;
  groups.forEach((g,gi)=>{
    const sector=shares[gi]*2*Math.PI,arc=sector*R-margin;g.a0=a0;g.sector=sector;
    if(n>1){const pg=track(new THREE.BoxGeometry(0.025,2.1,SHELF_DEPTH)),p=new THREE.Mesh(pg,matBoard);
      p.position.set(Math.cos(a0)*(R+SHELF_DEPTH/2),1.27,Math.sin(a0)*(R+SHELF_DEPTH/2));p.lookAt(0,1.27,0);room.add(p);
      const mid=a0+sector/2,lw=Math.min(arc*0.9,1.4),lab=labelMesh(g.name+' · '+g.books.length,lw,0.12,{family:'Spectral, Georgia, serif',fg:'#e8d6a8',bg:'#21160e'});
      lab.position.set(Math.cos(mid)*(R-0.005),2.41,Math.sin(mid)*(R-0.005));lab.lookAt(0,2.41,0);room.add(lab);}
    const start=a0+(margin/2)/R;let row=0,s=0,lastDec=null;
    g.books.forEach(b=>{
      const t=b.t/1000,h=b.h/1000,w=b.w/1000;
      if(s+t+GAP>arc&&s>0){row++;s=0;}
      const y0=ROWS[Math.min(row,ROWS.length-1)],ang=start+(s+t/2)/R,bookStart=s;s+=t+GAP;
      const key=t+'x'+h+'x'+w;let gm=geo.get(key);if(!gm){gm=track(new THREE.BoxGeometry(t,h,w));geo.set(key,gm);}
      const side=track(new THREE.MeshStandardMaterial({color:b.color,roughness:0.85}));
      const spine=track(new THREE.MeshStandardMaterial({map:spineTexture(b),roughness:0.75}));
      // faces: +x front cover, -x back cover, +y/-y page edges, +z spine (faces centre), -z fore-edge
      const mesh=new THREE.Mesh(gm,[side,side,matPages,matPages,spine,matPages]);
      const rad=R+0.012+w/2,y=y0+BOARD_T/2+h/2+0.001;
      mesh.position.set(Math.cos(ang)*rad,y,Math.sin(ang)*rad);mesh.lookAt(0,y,0);
      mesh.userData={book:b,ang,home:mesh.position.clone(),homeQ:mesh.quaternion.clone(),pull:0,p:0};
      b.ang=ang;b.y=y;b.gi=gi;room.add(mesh);bookMeshes.push(mesh);
      const dec=b.year!=null?Math.floor(b.year/10)*10:null;
      if(dec!==lastDec&&dec!=null){lastDec=dec;const lab=labelMesh(String(dec),0.075,0.018,{px:32});
        const la=start+bookStart/R+0.0375/R;lab.position.set(Math.cos(la)*(R-0.002),y0,Math.sin(la)*(R-0.002));lab.lookAt(0,y0,0);room.add(lab);}
    });
    a0+=sector;
  });
  updateGroupSelect();goToGroup(0,true);
}

/* ---------- Camera ---------- */
let yaw=0,pitch=0,tYaw=0,tPitch=0,fov=62,tFov=62;
function aim(){const cp=Math.cos(pitch);camera.lookAt(Math.cos(yaw)*cp,EYE+Math.sin(pitch),Math.sin(yaw)*cp);}
function nearest(cur,t){let d=t-cur;d=((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return cur+d;}
function lookAtBook(b,instant){tYaw=nearest(yaw,b.ang);tPitch=Math.atan2(b.y-EYE,R);if(instant){yaw=tYaw;pitch=tPitch;}}
function curGroup(){return groups.length>1?Number($('group').value||0):0;}
function goToGroup(gi,instant){const g=groups[gi];if(!g)return;
  if(groups.length>1){tYaw=nearest(yaw,g.a0+g.sector/2);tPitch=Math.atan2(ROWS[0]+0.1-EYE,R);if(instant){yaw=tYaw;pitch=tPitch;}}
  else lookAtBook(g.books[0],instant);
  updateYearRange();}
function updateGroupSelect(){const gs=$('group');gs.innerHTML='';gs.hidden=groups.length<2;
  groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.name+' ('+g.books.length+')';gs.appendChild(o);});}
function updateYearRange(){const bs=(groups[curGroup()]?.books||[]).filter(b=>b.year!=null);const el=$('year');
  if(!bs.length)return;el.min=bs[0].year;el.max=bs[bs.length-1].year;el.value=bs[0].year;$('yearOut').textContent=bs[0].year;}

let drag=null,moved=0;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);drag={x:e.clientX,y:e.clientY};
  const k=(fov/62)*0.0042;tYaw-=dx*k;tPitch=Math.max(-1.1,Math.min(1.1,tPitch+dy*k));hideTip();}else hover(e);});
canvas.addEventListener('pointerup',e=>{canvas.classList.remove('dragging');if(drag&&moved<6)pick(e);drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{e.preventDefault();tFov=Math.max(18,Math.min(85,tFov+e.deltaY*0.03));},{passive:false});
$('zin').onclick=()=>tFov=Math.max(18,tFov-10);$('zout').onclick=()=>tFov=Math.min(85,tFov+10);
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowLeft')tYaw-=0.12;if(e.key==='ArrowRight')tYaw+=0.12;if(e.key==='ArrowUp')tPitch=Math.min(1.1,tPitch+0.08);if(e.key==='ArrowDown')tPitch=Math.max(-1.1,tPitch-0.08);if(e.key==='Escape')hideCard();});

/* ---------- Picking & card ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),tip=$('tip');
function hit(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);return ray.intersectObjects(bookMeshes,false)[0]?.object||null;}
let hoverT=0;
function hover(e){const now=performance.now();if(now-hoverT<40)return;hoverT=now;const m=hit(e);canvas.classList.toggle('hovering',!!m);
  if(m){const b=m.userData.book;tip.hidden=false;tip.textContent=b.title+' — '+b.author+(b.year!=null?' · '+b.year:'');tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px';}else hideTip();}
function hideTip(){tip.hidden=true;}
let selected=null;
const loader=new THREE.TextureLoader();
function pick(e){const m=hit(e);if(m)select(m);}
function select(m){if(selected&&selected!==m)selected.userData.pull=0;selected=m;m.userData.pull=1;const b=m.userData.book;
  if(!m.userData.coverDone){m.userData.coverDone=true;
    const setCover=tex=>{tex.encoding=THREE.sRGBEncoding;track(tex);m.material[0]=track(new THREE.MeshStandardMaterial({map:tex,roughness:0.8}));};
    if(b.cover)loader.load(b.cover,setCover,undefined,()=>setCover(coverTexture(b)));else setCover(coverTexture(b));}
  lookAtBook(b);showCard(b);}
function mm(v){return Math.round(v)+' mm';}
function link(href,text){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';a.textContent=text;return a;}
let cardBook=null;
function showCard(b){cardBook=b;
  $('cTitle').textContent=b.title;$('cOrig').textContent=b.original_title||'';$('cOrig').hidden=!b.original_title;
  $('cAuthor').textContent=b.author;$('cYear').textContent=b.year_text||'—';$('cLang').textContent=langName(b.language);
  $('cGenre').textContent=genreName(b.genre)+(b.genre_text?' ('+b.genre_text+')':'');$('cSales').textContent=b.sales_text;
  $('cH').textContent=mm(b.h)+(b.hwEstimated?' *':'');$('cW').textContent=mm(b.w)+(b.hwEstimated?' *':'');
  $('cT').textContent=mm(b.t)+(b.tEstimated||b.dims_method==='pages_estimate'?' *':'');
  const notes=[];if(b.hwEstimated)notes.push(T('estDefault'));
  if(b.dims_method==='pages_estimate')notes.push(T('estThick'));else if(b.tEstimated)notes.push(T('noThick'));
  $('cNote').textContent=notes.map(n=>'* '+n).join(' ');
  const src=$('cSrc');src.innerHTML='';src.append(link(b.list_source,T('listSrc')));
  if(b.edition_source)src.append(link(b.edition_source,T('edSrc')));
  if(b.cover)src.append(document.createTextNode(T('coverSrc')));
  const note=document.createElement('span');note.textContent=T('genreNote');src.append(note);
  $('card').hidden=false;}
function hideCard(){$('card').hidden=true;cardBook=null;if(selected)selected.userData.pull=0;}
$('closeCard').onclick=hideCard;

/* ---------- Controls & language ---------- */
function fillGenreFilter(){const gf=$('genreFilter'),cur=gf.value||'*';gf.innerHTML='';
  const counts={};DATA.books.forEach(b=>b.genre_tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  const all=document.createElement('option');all.value='*';all.textContent=T('allGenres')+' ('+DATA.books.length+')';gf.appendChild(all);
  Object.keys(DATA.genres).filter(k=>counts[k]).sort((a,b)=>counts[b]-counts[a]).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=genreName(k)+' ('+counts[k]+')';gf.appendChild(o);});
  gf.value=cur;}
function applyLang(){document.documentElement.lang=lang;document.title=T('title');$('lang').textContent=lang==='uz'?'EN':'UZ';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=T(el.dataset.i18nHtml));
  if(DATA){fillGenreFilter();const gi=curGroup();build();if(groups.length>1){$('group').value=gi;goToGroup(gi,true);}}}
$('lang').onclick=()=>{lang=lang==='uz'?'en':'uz';try{localStorage.setItem('kc-lang',lang);}catch(e){}applyLang();};
$('mode').onchange=build;$('genreFilter').onchange=build;
$('group').onchange=e=>goToGroup(Number(e.target.value));
$('year').oninput=e=>{const y=Number(e.target.value);$('yearOut').textContent=y;const bs=groups[curGroup()]?.books||[];
  const b=bs.find(x=>x.year!=null&&x.year>=y)||bs[bs.length-1];if(b)lookAtBook(b);};

/* ---------- Loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tmpQ=new THREE.Quaternion(),turn=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2),dir=new THREE.Vector3();
function frame(){const k=reduce?1:0.12;yaw+=(tYaw-yaw)*k;pitch+=(tPitch-pitch)*k;fov+=(tFov-fov)*k;
  if(Math.abs(camera.fov-fov)>0.01){camera.fov=fov;camera.updateProjectionMatrix();}aim();
  for(const m of bookMeshes){const u=m.userData;u.p+=(u.pull-u.p)*(reduce?1:0.14);
    if(u.p>0.001||u.pull){dir.set(-Math.cos(u.ang),0,-Math.sin(u.ang));m.position.copy(u.home).addScaledVector(dir,u.p*0.42);m.position.y=u.home.y+u.p*0.05;
      tmpQ.copy(u.homeQ).multiply(turn);m.quaternion.copy(u.homeQ).slerp(tmpQ,u.p);}
    else if(u.p!==0){u.p=0;m.position.copy(u.home);m.quaternion.copy(u.homeQ);}}
  renderer.render(scene,camera);requestAnimationFrame(frame);}

applyLang();
const fonts=document.fonts?.load?Promise.all([document.fonts.load('600 20px Spectral'),document.fonts.load('500 14px "IBM Plex Mono"')]).catch(()=>{}):Promise.resolve();
Promise.all([fetch('data/books.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}),Promise.race([fonts,new Promise(r=>setTimeout(r,2500))])])
  .then(([d])=>{DATA=d;fillGenreFilter();build();frame();})
  .catch(err=>{console.error(err);showMsg(T('loadFail'));});
})();
</script>
</body>
